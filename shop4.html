<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oderpreoderdrip | SHOP 4</title>
    <link id="dynamic-favicon" rel="icon" type="image/png" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *:focus, *:active {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            outline: none !important;
            caret-color: transparent !important;
        }

        body { background-color: #000000; color: #ffffff; overflow-x: hidden; font-family: 'Kanit', sans-serif; opacity: 0; transition: opacity 0.5s ease; }
        body.loaded { opacity: 1; }
        #bg-image-layer {
            background-size: cover; background-position: center;
            transition: background-image 0.5s ease-in-out;
        }
        
        .logo-wrapper { perspective: 1500px; }
        .logo-element { transform-style: preserve-3d; width: 100%; height: 100%; position: relative; }
        .face {
            position: absolute; inset: 0; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: transparent;
        }
        .face-front { transform: translateZ(5px); }
        .face-back { transform: rotateY(180deg) translateZ(5px); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        
        .product-card { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); background: transparent; border: none; }
        .product-card:hover { transform: translateY(-5px); }

        .img-container { position: relative; width: 100%; height: 100%; }
        .product-img-element {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain; object-position: center;
            opacity: 0; transition: opacity 0.5s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .product-img-element.active { opacity: 1; }
        .product-card:hover .product-img-element.active { transform: scale(1.04); }

        .shimmer-box {
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        .shimmer-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            animation: shimmer-line 6s ease-in-out infinite;
        }
        @keyframes shimmer-line {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        .size-btn {
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .size-btn.selected {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast-item {
            background: #111; border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 12px 20px; font-size: 13px; font-family: 'Kanit', sans-serif; letter-spacing: 0.05em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: slideIn 0.3s ease forwards; pointer-events: auto;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        #zoom-modal { transition: opacity 0.3s ease; }
        img, svg { user-select: none; -webkit-user-drag: none; }
    </style>
</head>
<body class="min-h-screen selection:bg-white selection:text-black relative">

    <div id="toast-container"></div>

    <div id="bg-image-layer" class="fixed inset-0 z-0 pointer-events-none opacity-20"></div>
    <div class="fixed inset-0 z-[1] bg-black/80 pointer-events-none"></div>
    <canvas id="dust-canvas" class="fixed inset-0 z-[2] pointer-events-none opacity-30"></canvas>

    <div class="relative z-10 flex flex-col min-h-screen">
        <nav class="border-b border-gray-900 bg-black/90 backdrop-blur-md sticky top-0 z-40 w-full">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <a href="index.html" class="text-white hover:text-gray-400 transition-colors nav-link" aria-label="Home">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                </a>
                
                <div class="flex gap-6 items-center">
                    <a href="admin.html" class="text-gray-400 hover:text-white transition-colors nav-link" aria-label="Admin">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                    <button id="cart-btn" class="relative text-white hover:text-gray-300 transition-colors flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-white text-black text-[10px] font-semibold w-4 h-4 flex items-center justify-center rounded-full">0</span>
                    </button>
                </div>
            </div>
        </nav>

        <header class="pt-12 pb-10 px-6 flex flex-col items-center w-full">
            <div id="logo-container" class="logo-wrapper w-56 h-56 sm:w-64 sm:h-64 cursor-grab active:cursor-grabbing relative flex items-center justify-center touch-none mb-4">
                <div id="logo-element" class="logo-element w-full h-full flex items-center justify-center">
                    <div class="face face-front p-2 flex items-center justify-center w-full h-full">
                        <img id="shop-logo-img" src="" alt="Logo" class="object-contain drop-shadow-2xl transition-all duration-300" style="max-height: 100%; max-width: 100%;" onerror="this.src='https://via.placeholder.com/200?text=OPD'">
                    </div>
                    <div class="face face-back p-2 flex items-center justify-center w-full h-full">
                        <img id="shop-logo-img-back" src="" alt="Logo Back" class="object-contain drop-shadow-2xl transition-all duration-300" style="max-height: 100%; max-width: 100%;" onerror="this.src='https://via.placeholder.com/200?text=OPD'">
                    </div>
                </div>
            </div>
            
            <div id="realtime-clock" class="shimmer-box text-xs font-light tracking-[0.2em] text-gray-300 uppercase px-5 py-2 rounded-full">
                กำลังโหลดเวลา...
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-10 flex-1 w-full">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
                <div class="col-span-full flex flex-col items-center justify-center py-20">
                    <div class="w-8 h-8 border-2 border-gray-800 border-t-white rounded-full animate-spin mb-4"></div>
                    <p class="text-gray-500 tracking-wider text-xs">กำลังโหลดสินค้า...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- ตะกร้าสินค้า -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-[#050505] border-l border-gray-800 z-50 transform translate-x-full transition-transform duration-500 ease-out flex flex-col shadow-2xl">
        <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-black">
            <h2 class="text-sm font-semibold tracking-wider uppercase">ตะกร้าสินค้าของคุณ (SHOP 4)</h2>
            <button id="close-cart" class="text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

        <div class="p-6 border-t border-gray-800 bg-black">
            <div class="flex justify-between items-center mb-6">
                <span class="text-xs font-light tracking-wider text-gray-400 uppercase">ยอดรวมทั้งหมด</span>
                <span id="cart-total" class="text-xl font-medium text-white">฿0</span>
            </div>
            <button id="checkout-btn" class="w-full bg-white text-black font-semibold tracking-wider text-xs uppercase py-4 hover:bg-gray-200 transition-colors">
                ติดต่อสั่งซื้อผ่าน IG
            </button>
        </div>
    </div>
    <div id="cart-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-500"></div>

    <!-- Modal รายละเอียดสินค้า -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center px-4">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/85 backdrop-blur-md transition-opacity"></div>
        <div class="relative bg-[#080808] border border-gray-800 w-full max-w-4xl shadow-2xl flex flex-col md:flex-row overflow-hidden transform scale-95 opacity-0 transition-all duration-300" id="modal-content-box">
            <button id="close-modal" class="absolute top-4 right-4 z-10 bg-black/60 p-2 text-gray-400 hover:text-white border border-gray-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="w-full md:w-1/2 p-6 bg-black flex flex-col gap-4 border-r border-gray-900">
                <div class="aspect-[3/4] bg-gray-900/50 overflow-hidden relative cursor-zoom-in flex items-center justify-center" id="zoom-container" title="คลิกเพื่อซูมดูรูปภาพ">
                    <img id="modal-img" src="" alt="" class="w-full h-full object-contain transition-transform duration-300 drop-shadow-2xl" onerror="this.src='https://via.placeholder.com/400x533?text=NO+IMAGE'">
                </div>
                <div id="modal-sub-images" class="flex gap-2 overflow-x-auto pb-2"></div>
            </div>
            <div class="w-full md:w-1/2 p-8 flex flex-col justify-between max-h-[85vh] overflow-y-auto">
                <div>
                    <p class="text-[10px] tracking-[0.2em] uppercase text-gray-500 mb-1">oderpreoderdrip exclusive</p>
                    <h2 id="modal-title" class="text-2xl font-semibold uppercase tracking-wide mb-2 text-white">ชื่อสินค้า</h2>
                    <p id="modal-price" class="text-xl font-medium text-white mb-2">฿0</p>
                    <p id="modal-stock-status" class="text-xs text-gray-400 mb-6 font-light">สินค้าคงเหลือ: 0 ชิ้น</p>
                    
                    <div class="mb-6">
                        <p class="text-xs font-semibold tracking-wider text-gray-400 uppercase mb-2">รายละเอียดเชิงลึก</p>
                        <p id="modal-desc" class="text-xs text-gray-300 leading-relaxed font-light whitespace-pre-line">-</p>
                    </div>

                    <div class="mb-6">
                        <p class="text-xs font-semibold tracking-wider text-gray-400 uppercase mb-2">เลือกขนาด (Size)</p>
                        <div class="flex gap-3" id="size-selector">
                            <button class="size-btn flex-1 py-2.5 text-xs text-gray-300 font-light" data-size="S">S</button>
                            <button class="size-btn flex-1 py-2.5 text-xs text-gray-300 font-semibold selected" data-size="M">M</button>
                            <button class="size-btn flex-1 py-2.5 text-xs text-gray-300 font-light" data-size="L">L</button>
                            <button class="size-btn flex-1 py-2.5 text-xs text-gray-300 font-light" data-size="XL">XL</button>
                        </div>
                    </div>

                    <div class="mb-8 flex items-center gap-4">
                        <p class="text-xs font-semibold tracking-wider text-gray-400 uppercase">จำนวน</p>
                        <div class="flex items-center border border-gray-800 bg-black">
                            <button id="qty-minus" class="px-4 py-2 text-gray-400 hover:text-white">-</button>
                            <span id="qty-val" class="px-4 text-sm font-medium">1</span>
                            <button id="qty-plus" class="px-4 py-2 text-gray-400 hover:text-white">+</button>
                        </div>
                    </div>
                </div>

                <button id="add-to-cart-btn" class="w-full bg-white text-black font-semibold tracking-wider text-xs uppercase py-4 hover:bg-gray-200 transition-colors">
                    เพิ่มลงตะกร้าสินค้า
                </button>
            </div>
        </div>
    </div>

    <div id="zoom-modal" class="fixed inset-0 z-[100] bg-black/95 hidden flex items-center justify-center p-4 cursor-zoom-out">
        <img id="zoom-img" src="" class="max-w-full max-h-full object-contain">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAIQvWAlhRtdOqEAaxYDKbarjqSRHSIbI",
            authDomain: "oderpreoderdrip.firebaseapp.com",
            projectId: "oderpreoderdrip",
            storageBucket: "oderpreoderdrip.firebasestorage.app",
            messagingSenderId: "378045273142",
            appId: "1:378045273142:web:d8f7f7fc81f2f43217b497",
            measurementId: "G-SXRERXNTKK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let productsData = {};
        let globalIgUrl = "https://instagram.com";

        function updateClock() {
            const now = new Date();
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('realtime-clock').innerText = now.toLocaleDateString('th-TH', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const item = document.createElement('div');
            item.className = 'toast-item';
            item.innerText = message;
            container.appendChild(item);
            setTimeout(() => { item.style.opacity = '0'; setTimeout(() => item.remove(), 300); }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => { document.body.classList.add('loaded'); });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = link.getAttribute('href');
                document.body.style.opacity = '0';
                setTimeout(() => { window.location.href = target; }, 500);
            });
        });

        async function fetchSettings() {
            try {
                const snap = await getDoc(doc(db, "settings", "general"));
                if(snap.exists()) {
                    const data = snap.data();
                    if(data.logoUrl) {
                        document.getElementById('shop-logo-img').src = data.logoUrl;
                        document.getElementById('shop-logo-img-back').src = data.logoUrl;
                    }
                    if(data.faviconUrl) {
                        let favicon = document.getElementById('dynamic-favicon');
                        if (!favicon) {
                            favicon = document.createElement('link');
                            favicon.id = 'dynamic-favicon';
                            favicon.rel = 'icon';
                            document.head.appendChild(favicon);
                        }
                        favicon.href = data.faviconUrl;
                    }
                    if(data.shopLogoScale) {
                        document.getElementById('shop-logo-img').style.width = data.shopLogoScale;
                        document.getElementById('shop-logo-img').style.height = data.shopLogoScale;
                        document.getElementById('shop-logo-img-back').style.width = data.shopLogoScale;
                        document.getElementById('shop-logo-img-back').style.height = data.shopLogoScale;
                    }
                    if(data.bgShop) {
                        document.getElementById('bg-image-layer').style.backgroundImage = `url('${data.bgShop}')`;
                    }
                    if(data.igUrl) {
                        globalIgUrl = data.igUrl;
                    }
                }
            } catch(e) { console.error(e); }
        }
        fetchSettings();

        // 🟢 ดึงข้อมูลจาก Collection "products4"
        const q = query(collection(db, "products4"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const productList = document.getElementById('product-list');
            productList.innerHTML = ''; 
            
            if(snapshot.empty) {
                productList.innerHTML = `<div class="col-span-full text-center py-20 text-gray-600 tracking-wider uppercase text-xs">ไม่พบสินค้าในระบบ</div>`;
                return;
            }

            let index = 0;
            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const imageSrc = data.imageUrl || 'https://via.placeholder.com/400x533?text=NO+IMAGE';
                const stock = Number(data.stock) || 0;
                
                let images = [imageSrc];
                if(data.imageUrl2) images.push(data.imageUrl2);
                if(data.imageUrl3) images.push(data.imageUrl3);
                if(data.imageUrl4) images.push(data.imageUrl4);

                productsData[id] = { id, name: data.name, price: Number(data.price), stock: stock, images, imageSrc, description: data.description || 'ไม่มีรายละเอียดสินค้าเพิ่มเติม' };

                const delay = index * 80;
                
                let imgTagsHTML = '';
                images.forEach((imgUrl, imgIdx) => {
                    imgTagsHTML += `<img src="${imgUrl}" class="product-img-element ${imgIdx === 0 ? 'active' : ''}" data-index="${imgIdx}" onerror="this.src='https://via.placeholder.com/400x533?text=IMAGE'">`;
                });

                const card = `
                    <div onclick="openProductModal('${id}')" data-id="${id}" class="product-card group flex flex-col cursor-pointer animate-fade-up" style="animation-delay: ${delay}ms;">
                        <div class="aspect-[3/4] relative flex items-center justify-center overflow-hidden bg-transparent p-2">
                            <div class="img-container" id="container-${id}">
                                ${imgTagsHTML}
                            </div>
                            <div class="absolute bottom-4 left-4 right-4 bg-black/60 backdrop-blur-md px-3 py-2 border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-center z-20">
                                <span class="text-[11px] font-light tracking-widest uppercase text-white">คลิกเพื่อดูรายละเอียด</span>
                            </div>
                        </div>
                        <div class="pt-4 pb-2 flex flex-col justify-between">
                            <h3 class="text-xs font-medium tracking-wide uppercase text-white truncate mb-1">${data.name}</h3>
                            <div class="flex justify-between items-center">
                                <p class="text-[11px] text-gray-500 font-light">คงเหลือ: ${stock} ชิ้น</p>
                                <p class="text-gray-300 text-sm font-medium">฿${data.price}</p>
                            </div>
                        </div>
                    </div>
                `;
                productList.innerHTML += card;
                index++;
            });

            setTimeout(() => {
                document.querySelectorAll('.product-card').forEach(card => {
                    const id = card.getAttribute('data-id');
                    const prod = productsData[id];
                    if(!prod || prod.images.length <= 1) return;

                    const container = document.getElementById(`container-${id}`);
                    const imgElements = container.querySelectorAll('.product-img-element');
                    let intervalId = null;
                    let currentIndex = 0;

                    const startLoop = () => {
                        if(intervalId) clearInterval(intervalId);
                        intervalId = setInterval(() => {
                            imgElements[currentIndex].classList.remove('active');
                            currentIndex = (currentIndex + 1) % imgElements.length;
                            imgElements[currentIndex].classList.add('active');
                        }, 1200);
                    };

                    const stopLoop = () => {
                        if(intervalId) clearInterval(intervalId);
                        imgElements[currentIndex].classList.remove('active');
                        currentIndex = 0;
                        imgElements[0].classList.add('active');
                    };

                    card.addEventListener('mouseenter', startLoop);
                    card.addEventListener('mouseleave', stopLoop);
                    card.addEventListener('touchstart', startLoop, {passive: true});
                    card.addEventListener('touchend', stopLoop);
                });
            }, 100);
        });

        // 🟢 ใช้ Local Storage เป็น opd_cart4 เพื่อแยกตะกร้าสินค้าของ Shop 4
        let cart = JSON.parse(localStorage.getItem('opd_cart4')) || [];
        let selectedProduct = null;
        let selectedSize = 'M';
        let selectedQty = 1;

        const updateCartUI = () => {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            const container = document.getElementById('cart-items-container');
            const totalEl = document.getElementById('cart-total');
            container.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = '<p class="text-gray-600 tracking-wider uppercase text-center mt-10 text-xs">ตะกร้าสินค้าว่างเปล่า</p>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price * item.qty;
                    container.innerHTML += `
                        <div class="flex gap-4 items-center bg-[#0a0a0a] border border-gray-800 p-3">
                            <img src="${item.imageSrc}" class="w-14 h-18 object-cover bg-gray-900" onerror="this.src='https://via.placeholder.com/80x96?text=X'">
                            <div class="flex-1 min-w-0">
                                <h4 class="text-xs font-semibold uppercase text-white truncate mb-1">${item.name}</h4>
                                <p class="text-[11px] text-gray-400">ไซส์: ${item.size} | จำนวน: ${item.qty}</p>
                                <p class="text-xs text-gray-300 mt-1">฿${item.price * item.qty}</p>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-gray-500 hover:text-red-400 p-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                });
            }
            totalEl.innerText = '฿' + total;
            
            // 🟢 เซฟลง opd_cart4
            localStorage.setItem('opd_cart4', JSON.stringify(cart));
        };

        window.removeFromCart = (index) => { 
            cart.splice(index, 1); 
            updateCartUI(); 
            showToast("ลบสินค้าออกจากตะกร้าแล้ว"); 
        };

        document.getElementById('add-to-cart-btn').addEventListener('click', () => {
            if(!selectedProduct) return;
            if(selectedProduct.stock <= 0) {
                showToast("แจ้งเตือน: สินค้ารุ่นนี้หมดชั่วคราว");
                return;
            }
            if(selectedQty > selectedProduct.stock) { 
                showToast("แจ้งเตือน: จำนวนสินค้าในสต็อกไม่เพียงพอ"); 
                return; 
            }
            const existingItem = cart.find(i => i.id === selectedProduct.id && i.size === selectedSize);
            if(existingItem) { 
                if(existingItem.qty + selectedQty > selectedProduct.stock) { 
                    showToast("แจ้งเตือน: สินค้าในตะกร้ารวมกับที่เลือกเกินสต็อกที่มี"); 
                    return; 
                }
                existingItem.qty += selectedQty; 
            } else { 
                cart.push({ ...selectedProduct, size: selectedSize, qty: selectedQty }); 
            }
            updateCartUI(); 
            closeModalFunc(); 
            toggleCart(); 
            showToast("เพิ่มสินค้าลงในตะกร้าสำเร็จ");
        });

        document.getElementById('checkout-btn').addEventListener('click', () => {
            if(cart.length === 0) { 
                showToast("แจ้งเตือน: ไม่มีสินค้าในตะกร้า ไม่สามารถดำเนินการต่อได้"); 
                return; 
            }
            cart = []; 
            updateCartUI(); 
            toggleCart(); 
            showToast("กำลังพุ่งไปยังหน้าติดต่อสั่งซื้อผ่าน IG...");
            setTimeout(() => { window.location.href = globalIgUrl; }, 1000);
        });

        const modal = document.getElementById('product-modal');
        const modalContent = document.getElementById('modal-content-box');
        
        window.openProductModal = (id) => {
            selectedProduct = productsData[id];
            selectedSize = 'M';
            selectedQty = 1;
            
            document.getElementById('modal-img').src = selectedProduct.imageSrc;
            document.getElementById('modal-title').innerText = selectedProduct.name;
            document.getElementById('modal-price').innerText = '฿' + selectedProduct.price;
            document.getElementById('modal-stock-status').innerText = `สินค้าคงเหลือ: ${selectedProduct.stock} ชิ้น`;
            document.getElementById('modal-desc').innerText = selectedProduct.description;
            document.getElementById('qty-val').innerText = selectedQty;
            
            const subImgContainer = document.getElementById('modal-sub-images');
            subImgContainer.innerHTML = '';
            selectedProduct.images.forEach((imgUrl, idx) => {
                const thumb = document.createElement('div');
                thumb.className = `w-16 h-20 bg-gray-900 cursor-pointer border ${idx === 0 ? 'border-white' : 'border-gray-800'} overflow-hidden flex-shrink-0`;
                thumb.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-contain">`;
                thumb.onclick = () => {
                    document.getElementById('modal-img').src = imgUrl;
                    subImgContainer.querySelectorAll('div').forEach(d => d.classList.replace('border-white', 'border-gray-800'));
                    thumb.classList.replace('border-gray-800', 'border-white');
                };
                subImgContainer.appendChild(thumb);
            });

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('selected');
                if(btn.dataset.size === 'M') { btn.classList.add('selected'); }
            });
            modal.classList.remove('hidden');
            setTimeout(() => { modalContent.classList.remove('scale-95', 'opacity-0'); modalContent.classList.add('scale-100', 'opacity-100'); }, 10);
        };

        const closeModalFunc = () => {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        document.getElementById('close-modal').addEventListener('click', closeModalFunc);
        document.getElementById('modal-backdrop').addEventListener('click', closeModalFunc);

        const zoomContainer = document.getElementById('zoom-container');
        const zoomModal = document.getElementById('zoom-modal');
        const zoomImg = document.getElementById('zoom-img');

        zoomContainer.addEventListener('click', () => {
            const currentImgSrc = document.getElementById('modal-img').src;
            zoomImg.src = currentImgSrc;
            zoomModal.classList.remove('hidden');
        });
        zoomModal.addEventListener('click', () => {
            zoomModal.classList.add('hidden');
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedSize = e.target.dataset.size;
            });
        });

        document.getElementById('qty-plus').addEventListener('click', () => { 
            if(selectedQty < selectedProduct.stock) { 
                selectedQty++; 
                document.getElementById('qty-val').innerText = selectedQty; 
            } else {
                showToast("แจ้งเตือน: ถึงจำนวนสูงสุดในสต็อกแล้ว");
            }
        });
        document.getElementById('qty-minus').addEventListener('click', () => { if(selectedQty > 1) selectedQty--; document.getElementById('qty-val').innerText = selectedQty; });

        const cartSidebar = document.getElementById('cart-sidebar');
        const cartOverlay = document.getElementById('cart-overlay');
        const toggleCart = () => {
            const isClosed = cartSidebar.classList.contains('translate-x-full');
            if(isClosed) {
                cartSidebar.classList.remove('translate-x-full'); cartOverlay.classList.remove('hidden');
                setTimeout(() => cartOverlay.classList.remove('opacity-0'), 10);
            } else {
                cartSidebar.classList.add('translate-x-full'); cartOverlay.classList.add('opacity-0');
                setTimeout(() => cartOverlay.classList.add('hidden'), 500);
            }
        };

        document.getElementById('cart-btn').addEventListener('click', toggleCart);
        document.getElementById('close-cart').addEventListener('click', toggleCart);
        cartOverlay.addEventListener('click', toggleCart);
        updateCartUI();

        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const particles = Array.from({length: 80}, () => ({
            x: Math.random() * width, y: Math.random() * height,
            r: Math.random() * 1.5 + 0.5, vx: Math.random() * 1.5 + 0.5,
            vy: (Math.random() - 0.5) * 1.5, opacity: Math.random() * 0.4 + 0.1
        }));
        const renderDust = () => {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x > width) p.x = 0; if (p.x < 0) p.x = width;
                if (p.y > height) p.y = 0; if (p.y < 0) p.y = height;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`; ctx.fill();
            });
            requestAnimationFrame(renderDust);
        };
        renderDust();

        // 3D Logo Rotation
        const logoContainer = document.getElementById('logo-container');
        const logoElement = document.getElementById('logo-element');
        let isDragging = false, prevX = 0, prevY = 0, velX = 0, velY = 0, rotX = 0, rotY = 0;
        let resetTimer = null;
        let isResetting = false;
        let targetRotX = 0, targetRotY = 0;

        const lerp = (start, end, factor) => start + (end - start) * factor;

        const animateLogo = () => {
            if (!isDragging) { 
                if (isResetting) {
                    rotX = lerp(rotX, targetRotX, 0.08);
                    rotY = lerp(rotY, targetRotY, 0.08);
                    if (Math.abs(rotX - targetRotX) < 0.1 && Math.abs(rotY - targetRotY) < 0.1) {
                        rotX = targetRotX;
                        rotY = targetRotY;
                        isResetting = false;
                    }
                } else {
                    velX *= 0.92; 
                    velY *= 0.92; 
                    rotX -= velY; 
                    rotY += (velX + 0.5); 
                }
            }
            logoElement.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            requestAnimationFrame(animateLogo);
        };
        animateLogo();

        const startDrag = (e) => { 
            isDragging = true; 
            isResetting = false;
            if (resetTimer) clearTimeout(resetTimer);
            prevX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; 
            prevY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY; 
            velX = 0; 
            velY = 0; 
        };
        const dragMove = (e) => { 
            if (!isDragging) return; 
            const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX, 
                  cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY; 
            velX = (cx - prevX) * 0.5; 
            velY = (cy - prevY) * 0.5; 
            prevX = cx; 
            prevY = cy; 
            rotX -= velY;
            rotY += velX;
        };
        const dragEnd = () => { 
            isDragging = false; 
            if (resetTimer) clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
                isResetting = true;
                targetRotX = Math.round(rotX / 360) * 360;
                targetRotY = Math.round(rotY / 360) * 360;
            }, 3000);
        };
        
        logoContainer.addEventListener('mousedown', startDrag); 
        window.addEventListener('mousemove', dragMove); 
        window.addEventListener('mouseup', dragEnd);
        logoContainer.addEventListener('touchstart', startDrag, {passive: true}); 
        window.addEventListener('touchmove', dragMove, {passive: true}); 
        window.addEventListener('touchend', dragEnd);
    </script>
</body>
</html>
